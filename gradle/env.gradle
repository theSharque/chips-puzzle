def loadDotEnv(File file) {
    def values = [:]
    if (!file.exists()) {
        return values
    }
    file.eachLine { raw ->
        def line = raw.trim()
        if (!line || line.startsWith('#')) {
            return
        }
        def eq = line.indexOf('=')
        if (eq < 1) {
            return
        }
        def key = line.substring(0, eq).trim()
        def value = line.substring(eq + 1).trim()
        if (value.length() >= 2) {
            def quote = value.charAt(0)
            if ((quote == '"' || quote == "'") && value.charAt(value.length() - 1) == quote) {
                value = value.substring(1, value.length() - 1)
            }
        }
        values[key] = value
    }
    return values
}

ext.dotenv = loadDotEnv(rootProject.file('.env'))
ext.secret = { String key ->
    def aliases = [
            PLAY_STORE_PASSWORD: ['BALLMAZE_STORE_PASSWORD'],
            PLAY_KEY_PASSWORD  : ['BALLMAZE_KEY_PASSWORD'],
            APK_STORE_PASSWORD : ['BALLMAZE_APK_STORE_PASSWORD'],
            APK_KEY_PASSWORD   : ['BALLMAZE_APK_KEY_PASSWORD']
    ]
    def keys = [key] + (aliases[key] ?: [])
    for (String name : keys) {
        def fromFile = rootProject.ext.dotenv[name]
        if (fromFile) {
            return fromFile
        }
        def fromEnv = System.getenv(name)
        if (fromEnv) {
            return fromEnv
        }
    }
    return null
}
